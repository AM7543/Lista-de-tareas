<!DOCTYPE html> <!--tipo: El DOCTYPE es una declaración que le dice al navegador qué versión de HTML se está utilizando. En este caso, se está utilizando HTML5. -->
<html lang="es"> <!--tipo: El atributo lang="es" indica que el contenido de la página está en español. Esto es importante para la accesibilidad y para los motores de búsqueda. -->
<head> <!--tipo: La sección <head> contiene metadatos sobre el documento, como el título, la codificación de caracteres y enlaces a hojas de estilo y scripts. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>

  <!-- Importar fuente de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body> <!--The body element represents the content of the document-->
  <main class="contenedor"> <!--The main element represents the main content of the body of a document or application. The main content area consists of content that is directly related to or expands upon the central topic of a document or central functionality of an application-->
    <h1 class="titulo">Lista de tareas</h1> <!--The h1 element represents a section heading.-->
    <form class="formulario" id="formulario">
      <input type="text" id="entrada" placeholder="Añadir una tarea" autocomplete="off" aria-label="Nueva tarea"> <!--The input element represents a typed data field, usually with a form control to allow the user to edit the data.-->
      <button type="submit" class="btn-anadir">Añadir</button>
    </form> <!--The form element represents a collection of form-associated elements, some of which can represent editable values that can be submitted to a server for processing-->

    <ul class="lista" id="lista"></ul> <!--The ul element represents a list of items, where the order of the items is not important — that is, where changing the order would not materially change the meaning of the document.-->
  </main>

  <script src="script.js"></script> <!--The script element allows authors to include dynamic script and data blocks in their documents. The element does not represent content for the user.-->
</body>
</html>
